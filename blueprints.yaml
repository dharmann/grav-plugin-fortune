name: Fortune
slug: fortune
type: plugin
version: 1.1.3
description: Select a random quote from a collection of properly formatted "fortune" files
icon: book
author:
  name: dharman
  email: dharman@mailp.it
original_author:
  name: "Aaron Dalton"
  email: "aaron@daltons.ca"
homepage: https://github.com/dharmann/grav-plugin-fortune
demo: https://10100.to
keywords: grav, plugin, fortune, quotes, random
bugs: https://github.com/dharmann/grav-plugin-fortune/issues
docs: https://github.com/dharmann/grav-plugin-fortune/blob/master/README.md
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    text_var:
      type: text
      label: PLUGIN_FORTUNE.TEXT_VARIABLE
      help: PLUGIN_FORTUNE.TEXT_VARIABLE_HELP
