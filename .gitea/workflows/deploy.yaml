name: Create Release
on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SemVer
        id: check_version
        run: |
          TAG=${GITHUB_REF_NAME}

          # 1. Check if it matches basic SemVer (Major.Minor.Patch) and Major > 0
          if [[ $TAG =~ ^[1-9][0-9]*\.([0-9]+)\.([0-9]+)$ ]]; then
            # Extract Minor and Patch from the regex capture groups
            MINOR=${BASH_REMATCH[1]}
            PATCH=${BASH_REMATCH[2]}

            # 2. Explicitly check that Minor and Patch are not 99
            if [[ "$MINOR" != "99" && "$PATCH" != "99" ]]; then
              echo "version_match=true" >> $GITHUB_OUTPUT
            else
              echo "version_match=false" >> $GITHUB_OUTPUT
              echo "Tag $TAG fails because Minor or Patch is 99."
            fi
          else
            echo "version_match=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not match Major>0.Minor.Patch format."
          fi

      # --- BEGIN COMPOSER INTEGRATION ---
      - name: Create Release
        if: steps.check_version.outputs.version_match == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl

      - name: Install Composer Dependencies
        if: steps.check_version.outputs.version_match == 'true'
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Get Repository Name
        if: steps.check_version.outputs.version_match == 'true'
        id: repo-name
        run: echo "name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Create Deployment Zip
        if: steps.check_version.outputs.version_match == 'true'
        run: |
          # Crea lo zip includendo la nuova cartella vendor, escludendo file git e lock
          zip -r ${{ steps.repo-name.outputs.name }}.zip . -x ".git*" ".github*" ".gitea*" "composer.lock"
      # --- END COMPOSER INTEGRATION ---

      # An action to create the release and to load the asset in one go!
      - name: Create Release and Upload Asset
        if: steps.check_version.outputs.version_match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release for version ${{ github.ref_name }}"
          files: ${{ steps.repo-name.outputs.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
